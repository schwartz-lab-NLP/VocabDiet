[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-diet"
version = "0.1.0"
description = "Compositional vocabularies for language models via vector arithmetic"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Yuval Reif"},
  {name = "Guy Kaplan"},
  {name = "Roy Schwartz"},
]
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.6",
  "tokenizers>=0.22,<=0.23",
  "datasets==4.5.0",
  "numpy>=1.26,<3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
posthoc = [
  "accelerate>=1.0,<2", "peft>=0.14,<1", "pandas>=2,<4",
  "scikit-learn>=1.4,<2", "scipy>=1.12,<2", "tabulate>=0.9",
  "torcheval>=0.0.7,<0.1",
  "spacy>=3.8,<4", "pyenchant>=3.2,<4", "pyinflect==0.5.1",
  "nltk>=3.9,<4", "sentencepiece>=0.2,<1", "lm-eval==0.4.13",
]
pretraining = [
  "spacy>=3.8,<4", "pyenchant>=3.2,<4", "pyinflect==0.5.1",
  "nltk>=3.9,<4", "sentencepiece>=0.2,<1", "wandb>=0.19,<1",
  "lm-eval==0.4.13", "tiktoken>=0.8,<1",
  "triton>=3.4,<4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
analysis = ["pandas>=2,<4", "matplotlib>=3.9,<4", "scipy>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/schwartz-lab-NLP/VocabDiet"
Paper = "https://aclanthology.org/2026.findings-acl.1618/"

[tool.setuptools.packages.find]
include = ["posthoc*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
